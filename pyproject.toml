[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keychronicle"
version = "1.0.0"
description = "Offline temporal HMAC trust audit for archived approvals"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
keychronicle = "keychronicle.cli:main"

[tool.setuptools]
packages = ["keychronicle"]
